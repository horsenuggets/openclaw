# Per-channel agent container.
# Each registered channel gets its own isolated agent with workspace, memory, tools.
# The discord-router forwards messages to these containers by channel ID.
#
# Usage:
#   OPENCLAW_CHANNEL_ID=... OPENCLAW_CHANNEL_PORT=18789 \
#     docker compose -f ~/deploy/docker/agent.yml up -d
services:
  agent:
    image: ubuntu:24.04
    container_name: agents.channel-${OPENCLAW_CHANNEL_ID}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/deploy/bin/openclaw:/usr/local/bin/openclaw:ro
      - ~/deploy/bin/gog:/usr/local/bin/gog:ro
      - ~/deploy/docs:/usr/local/bin/docs:ro
      - ~/.openclaw-instances/${OPENCLAW_CHANNEL_ID}:/root/.openclaw
      # Shared auth-profiles: a single host file mounted (read-write) over every
      # instance's own auth store. OAuth refresh tokens rotate, so a per-instance
      # copy goes stale (invalid_grant) once another instance refreshes. Sharing
      # one file means a refresh in any container is immediately seen by all.
      # boot.sh / openclawctl seed this file before the container starts (Docker
      # would otherwise create it as an empty directory).
      #
      # We deliberately do NOT bind-mount the sibling proper-lockfile lock
      # (`auth-profiles.json.lock`): that lock is a *directory* the library
      # creates with mkdir and removes with rmdir. Pre-creating it via a Docker
      # bind-mount makes the very first `mkdir` return EEXIST, so lock
      # acquisition fails with ELOCKED forever and token refresh permanently
      # breaks. Writes are already atomic (tmp file + rename), so the worst case
      # from an unshared lock is two containers refreshing the same rotated
      # token near-simultaneously and both landing a valid fresh token
      # (last-writer-wins) - rare and self-healing.
      - ~/.openclaw-instances/shared/auth/auth-profiles.json:/root/.openclaw/agents/main/agent/auth-profiles.json
      - ~/.claude:/root/.claude
      - ~/logs/channel-${OPENCLAW_CHANNEL_ID}:/tmp/openclaw
    environment:
      - OPENCLAW_SKIP_CHANNELS=1
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command: ["openclaw", "gateway", "--bind", "loopback", "--port", "${OPENCLAW_CHANNEL_PORT}"]
