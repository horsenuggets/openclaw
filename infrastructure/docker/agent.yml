# Per-channel agent container (token-free box).
#
# The agent runs entirely in here and holds NO external secrets:
#   - model requests go to the router's model proxy (real OAuth injected there)
#   - Discord sends go to the router's container proxy (bot token lives in the router)
# Only /workspace and /state are writable; the config is read-only and outside the
# agent's reach; nothing lives under the home directory.
#
# Networking: the box runs on the shared `oc-agents` bridge (created by openclawctl /
# boot.sh with a fixed gateway IP and inter-container communication disabled), NOT
# the host network. This gives it its own netns, so it can reach only the two router
# proxies (at the bridge gateway IP) and the public internet via NAT — not the host's
# loopback services (browser CDP, whisper, the health monitor). A sibling box is
# unreachable both ways: via the host its gateway is published to 127.0.0.1 only, and
# over the bridge the network's enable_icc=false drops box-to-box traffic. The gateway
# port is published to host loopback only (127.0.0.1) so the host-networked router can
# still reach this box's gateway; it is never exposed on the public NIC.
#
# Usage:
#   OPENCLAW_CHANNEL_ID=... OPENCLAW_CHANNEL_PORT=18789 \
#     docker compose -f ~/deploy/docker/agent.yml up -d
services:
  agent:
    image: ubuntu:24.04
    container_name: agents.channel-${OPENCLAW_CHANNEL_ID}
    restart: unless-stopped
    networks:
      - oc-agents
    # Publish the gateway to host loopback ONLY. The router shares the host network
    # and dials this box at 127.0.0.1:${OPENCLAW_CHANNEL_PORT}; binding the publish
    # to 127.0.0.1 keeps it off the public NIC and off sibling boxes (a bridge box
    # reaching the host gateway IP cannot see a 127.0.0.1-only published port).
    ports:
      - "127.0.0.1:${OPENCLAW_CHANNEL_PORT}:${OPENCLAW_CHANNEL_PORT}"
    # Non-root; the host workspace/state dirs are chown 1000:1000 by openclawctl.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits (pids_limit / mem_limit) are intentionally omitted: they
    # require cgroup v2 controller delegation that is not reliably available in
    # the deploy environment (the container fails to start with "cannot enter
    # cgroupv2 ... with domain controllers -- it is in threaded mode"). The
    # security-relevant hardening above does not depend on cgroup delegation.
    # Reintroduce DoS limits only once the host's cgroup setup is confirmed.
    volumes:
      - ~/deploy/bin/openclaw:/bin/openclaw:ro
      - ~/deploy/bin/gog:/usr/local/bin/gog:ro
      # Docs must sit next to the binary: openclaw resolves workspace templates as
      # <binary-dir>/docs (resolveOpenClawDocsPath). The binary is /bin/openclaw,
      # so docs mount at /bin/docs (not /usr/local/bin/docs) or `openclaw setup`
      # fails with "Missing workspace template".
      - ~/deploy/docs:/bin/docs:ro
      # Config is read-only and lives outside /workspace, so the agent's
      # workspace-confined file tools cannot read it. The gateway process reads
      # it once at startup. It carries no provider keys (the model proxy injects
      # the real token); gateway.auth.token is the only local-scope secret and
      # only authorizes talking to this agent's own gateway. The gateway binds all
      # interfaces inside the container (--bind lan) so the host loopback publish
      # works, so that token is what gates a sibling box on oc-agents from driving
      # this gateway directly.
      - ~/.openclaw-instances/${OPENCLAW_CHANNEL_ID}/openclaw.json:/etc/openclaw/openclaw.json:ro
      # The agent's work. Writable; the only mount the file tools can see.
      - ~/.openclaw-instances/${OPENCLAW_CHANNEL_ID}/workspace:/workspace
      # Runtime state: sessions, memory index, caches. Writable, not agent work.
      - ~/.openclaw-instances/${OPENCLAW_CHANNEL_ID}/state:/state
      # NOTE: no auth-profiles.json mount, no ~/.claude mount, no credentials/
      # mount. The box holds no external secrets by design.
    environment:
      - OPENCLAW_SKIP_CHANNELS=1
      - OPENCLAW_CONFIG_PATH=/etc/openclaw/openclaw.json
      - OPENCLAW_STATE_DIR=/state
      # Home points at the writable state mount so any stray home-relative write
      # (node/npm caches, etc.) lands there instead of failing on the read-only
      # rootfs.
      - HOME=/state
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # --bind lan => 0.0.0.0 inside the container's own netns (NOT the host LAN), so
    # the 127.0.0.1 host publish above can forward to it. Sibling-box access is
    # gated by gateway.auth.token.
    command: ["/bin/openclaw", "gateway", "--bind", "lan", "--port", "${OPENCLAW_CHANNEL_PORT}"]

# The shared agent bridge, created by openclawctl / boot.sh with a fixed subnet so
# the router can bind the proxies on its gateway IP. External here: this per-channel
# compose project joins it but never creates or destroys it. The compose-local key
# `oc-agents` maps to the real network named by OPENCLAW_AGENT_NETWORK, so a
# configured name other than the default still attaches to the network the scripts
# actually created.
networks:
  oc-agents:
    external: true
    name: ${OPENCLAW_AGENT_NETWORK}
