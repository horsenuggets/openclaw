services:
  discord-router:
    image: ubuntu:24.04
    container_name: services.discord-router
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/deploy/bin/discord-router:/usr/local/bin/discord-router:ro
      - ~/deploy/bin/health-monitor:/usr/local/bin/health-monitor:ro
      - ~/.openclaw-instances:/root/.openclaw-instances:ro
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Whitelist for /channel register/unregister: the auth guild id and the
      # role within it that grants access. Unset => /channel management is
      # disabled (fails closed). Kept out of the repo; supplied via host env.
      - OPENCLAW_AUTH_GUILD_ID=${OPENCLAW_AUTH_GUILD_ID}
      - OPENCLAW_WHITELIST_ROLE_ID=${OPENCLAW_WHITELIST_ROLE_ID}
      # Host provisioning daemon (discord-provisioner) the router calls over
      # loopback for /channel register|unregister. Unset => those are disabled.
      - OPENCLAW_PROVISIONER_PORT=${OPENCLAW_PROVISIONER_PORT}
      - OPENCLAW_PROVISIONER_TOKEN=${OPENCLAW_PROVISIONER_TOKEN}
      - OPENCLAW_INSTANCES_DIR=/root/.openclaw-instances
      - ROUTER_BIN=/usr/local/bin/discord-router
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/health-monitor.ok && test $(($(date +%s) - $(stat -c %Y /tmp/health-monitor.ok))) -lt 30",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command: ["health-monitor"]
