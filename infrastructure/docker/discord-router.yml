services:
  discord-router:
    image: ubuntu:24.04
    container_name: services.discord-router
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/deploy/bin/discord-router:/usr/local/bin/discord-router:ro
      - ~/deploy/bin/health-monitor:/usr/local/bin/health-monitor:ro
      # Category embed icons the router uploads with each message. The compiled
      # binary runs in a bare image with no repo tree, so the icons are mounted
      # here and located via OPENCLAW_EMBED_ASSETS_DIR below.
      - ~/deploy/embeds:/usr/local/share/openclaw/embeds:ro
      - ~/.openclaw-instances:/root/.openclaw-instances:ro
      # The model proxy owns OAuth refresh for the token-free agent boxes: when the
      # shared token expires it creates a proper-lockfile lock directory and
      # atomically rewrites shared/auth/auth-profiles.json. That one subtree must be
      # writable; the rest of the instances tree stays read-only. The nested rw bind
      # over the ro mount above makes only shared/auth writable.
      - ~/.openclaw-instances/shared/auth:/root/.openclaw-instances/shared/auth:rw
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Whitelist for /channel register/unregister: the auth guild id and the
      # role within it that grants access. Unset => /channel management is
      # disabled (fails closed). Kept out of the repo; supplied via host env.
      - OPENCLAW_AUTH_GUILD_ID=${OPENCLAW_AUTH_GUILD_ID}
      - OPENCLAW_WHITELIST_ROLE_ID=${OPENCLAW_WHITELIST_ROLE_ID}
      # Higher-privilege admin role within the same auth guild: may register any
      # channel (incl. on another user's behalf) and unregister any channel.
      # Unset => nobody is admin (only owners/whitelisted-DM rules apply).
      - OPENCLAW_ADMIN_ROLE_ID=${OPENCLAW_ADMIN_ROLE_ID}
      # Comma-separated user/bot ids granted admin + whitelist without the
      # auth-guild role lookup, for test/lab rigs whose router bot is not a
      # member of the auth server. Unset => no override (fail closed). Do not use
      # in production; add a real auth-server role instead.
      - OPENCLAW_ADMIN_OVERRIDE_IDS=${OPENCLAW_ADMIN_OVERRIDE_IDS}
      # The mock-user bot id allowed to hold normal conversations with the agent,
      # not just run /channel commands. This is the bot that drives end-to-end
      # tests. Unset => all bots are chat-filtered.
      - OPENCLAW_MOCK_USER_BOT_ID=${OPENCLAW_MOCK_USER_BOT_ID}
      # Test-only: comma-separated bot ids subjected to the human channel-owner
      # access gate (denied when not the channel owner) instead of bypassing it as
      # trusted bots do, so an E2E driver bot can exercise the unauthorized-access
      # denial. Unset => no bot is owner-gated. Never set in production.
      - OPENCLAW_ROUTER_OWNER_GATED_BOT_IDS=${OPENCLAW_ROUTER_OWNER_GATED_BOT_IDS}
      # Reply to a non-owner messaging a registered channel with a Log embed
      # explaining the channel belongs to someone else. Unset/truthy => enabled;
      # set falsy (0/false/no/off) to deny silently.
      - OPENCLAW_ROUTER_UNAUTHORIZED_NOTICE=${OPENCLAW_ROUTER_UNAUTHORIZED_NOTICE}
      # Host provisioning daemon (discord-provisioner) the router calls over
      # loopback for /channel register|unregister. Unset => those are disabled.
      - OPENCLAW_PROVISIONER_PORT=${OPENCLAW_PROVISIONER_PORT}
      - OPENCLAW_PROVISIONER_TOKEN=${OPENCLAW_PROVISIONER_TOKEN}
      # Loopback port of the whisper speech-to-text server for voice-message
      # transcription. boot.sh exports WHISPER_PORT (the same value whisper.yml
      # binds) so the router always targets the running server.
      - OPENCLAW_WHISPER_PORT=${WHISPER_PORT}
      - OPENCLAW_INSTANCES_DIR=/root/.openclaw-instances
      - ROUTER_BIN=/usr/local/bin/discord-router
      # Where the category embed icons are mounted (see the volume above). The
      # router uploads these with each embed; fixed container path, not from .env.
      - OPENCLAW_EMBED_ASSETS_DIR=/usr/local/share/openclaw/embeds
      # Interface the model + container proxies bind. boot.sh sets this to the
      # agent bridge's gateway IP so the token-free boxes (now on that bridge, not
      # the host network) can reach the proxies while they stay off the public NIC.
      # The router is host-networked, so it shares the host netns and can bind that
      # bridge gateway address. No default: an unset value is a deploy error.
      - OPENCLAW_PROXY_BIND=${OPENCLAW_PROXY_BIND}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/health-monitor.ok && test $(($(date +%s) - $(stat -c %Y /tmp/health-monitor.ok))) -lt 30",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command: ["health-monitor"]
